name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tag must match manifest version
        run: test "v$(jq -r .version public/manifest.json)" = "$GITHUB_REF_NAME"
      - run: bun run check
      - run: bun run zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv lemontabs.zip "lemontabs-$GITHUB_REF_NAME.zip"
          gh release create "$GITHUB_REF_NAME" "lemontabs-$GITHUB_REF_NAME.zip" \
            --title "lemontabs $GITHUB_REF_NAME" --generate-notes
